[package]
name = "pal"
version = "0.1.0"
description = "A launcher: one search box over apps, bookmarks, clipboard, emoji, a calculator and your own extensions"
edition = "2021"
publish = false

[lib]
name = "pal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pal-core = { path = "../../core" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# settings: manifest defaults as the table the core overlays
toml = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
tauri-plugin-single-instance = "2"
clap = { version = "4", features = ["derive"] }
url = "2"
# pick effects: clipboard write
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
