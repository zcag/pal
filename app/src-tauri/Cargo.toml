[package]
name = "pal"
version = "0.4.0"
description = "A launcher: one search box over apps, bookmarks, clipboard, emoji, a calculator and your own extensions"
edition = "2021"
publish = false

[lib]
name = "pal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pal-core = { path = "../../core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# settings: manifest defaults as the table the core overlays
toml = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
# deep-link: a second process's `pal://` argv reaches the plugin in the instance (deeplink.rs)
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# launch at login: a LaunchAgent on macOS, an XDG autostart entry on Linux
tauri-plugin-autostart = "2"
clap = { version = "4", features = ["derive"] }
url = "2"
# updates: the GitHub release manifest, checked on start and daily (updater.rs)
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# bar items: the menu bar glyphs rasterised from the bundled Nerd Font (bar/glyph.rs)
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
# bar items: `data:image/...` icons on the strip
base64 = "0.22"
# `pal://` links (deeplink.rs); percent-encoding decodes their parts
tauri-plugin-deep-link = "2"
percent-encoding = "2"
# pick: the CLI's SIGINT handler unlinks its reply socket before exiting 130 (pick.rs)
libc = "0.2"
# states: `pal state watch` follows the feed file (states.rs)
notify = "8"
# snippet expansion: `{uuid}` in an expanded snippet (expansion.rs)
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
window-vibrancy = "0.6"
# bar items: the popover's key monitor and the wake/focus triggers (bar/popover.rs, bar/mod.rs)
# colour: NSColorSampler, the loupe the system draws, and NSColor/NSColorSpace to read the pick in sRGB (color.rs)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSWorkspace", "NSRunningApplication", "NSResponder", "NSWindow", "NSPanel", "NSScreen", "NSGraphics", "NSColor", "NSColorSampler", "NSColorSpace", "objc2-core-foundation", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSDistributedNotificationCenter", "NSString", "NSGeometry", "NSOperation", "block2"] }
# states: `idle` reads the seconds since the last input event (states.rs); hotkeys: the event tap for cmd+tab (hotkey.rs)
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGColor", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFMachPort", "CFRunLoop", "CFString"] }
block2 = "0.6"
# permissions: CoreLocation for the Location Services prompt that unlocks Wi-Fi network names (permissions.rs)
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocationManager", "CLLocationManagerDelegate"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# the HUD's webview size request (panel/linux.rs); the version tauri uses
gtk = "0.18"

[dev-dependencies]
tempfile = "3"
