[package]
name = "pal"
version = "0.1.0"
description = "A launcher: one search box over apps, bookmarks, clipboard, emoji, a calculator and your own extensions"
edition = "2021"
publish = false

[lib]
name = "pal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pal-core = { path = "../../core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# settings: manifest defaults as the table the core overlays
toml = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
tauri-plugin-single-instance = "2"
# launch at login: a LaunchAgent on macOS, an XDG autostart entry on Linux
tauri-plugin-autostart = "2"
clap = { version = "4", features = ["derive"] }
url = "2"
# updates: the GitHub release manifest, checked on start and daily (updater.rs)
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
window-vibrancy = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
tempfile = "3"
