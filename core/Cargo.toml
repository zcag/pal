[package]
name = "pal-core"
version = "0.4.3"
edition = "2021"
description = "pal core: config, index, frecency, icons, clipboard, windows, system commands"

[lib]
name = "pal_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1"
toml_edit = "0.25"
schemars = "1"
notify = "8"
nucleo-matcher = "0.3"
thiserror = "2"
dirs = "6"
# icons
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
ico = "0.5"
resvg = { version = "0.48", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
url = "2"
sha2 = "0.10"
# media: the MediaRemote stream's artwork arrives base64
base64 = "0.22"
# states: the expression language of `[states]` and `show_when` (docs/design/states.md)
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
# extensions: the GitHub tarball, and staging inside the store
tar = "0.4"
flate2 = "1"
tempfile = "3"
# clipboard: history store; bundled so the app ships one known SQLite (with FTS5) on both platforms
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
# system: dlopen the login framework's lock-screen call
libc = "0.2"
plist = "1"
icns = { version = "0.5", default-features = false, features = ["pngio"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry", "NSArray", "NSEnumerator", "NSURL", "NSValue"] }
# NSScreen + NSGraphics: the displays (frame, visibleFrame, NSScreenNumber) for the window layouts
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSScreen", "NSGraphics", "objc2-core-graphics", "libc"] }
# clipboard paste: synthesise Cmd+V; windows: the window list
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGError", "CGWindow", "CGColor"] }
# windows: the AXUIElement C API speaks CF types
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString", "CFNumber", "CFCGTypes", "CFRunLoop"] }
# audio: the CoreAudio HAL (devices, defaults, volume, mute) without a tool to install
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
# bluetooth: IOBluetoothDevice for connect/disconnect (the list is system_profiler's)
objc2-io-bluetooth = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "IOBluetoothObject", "IOBluetoothDevice"] }
# calendar: EventKit (the store, events, calendars, participants; block2 for the access prompt's completion, CGColor for a calendar's colour)
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-graphics", "EKObject", "EKTypes", "EKEventStore", "EKEvent", "EKCalendar", "EKCalendarItem", "EKParticipant", "EKSource"] }
block2 = "0.6"
# ocr: the Vision text recogniser (VNRecognizeTextRequest over a file URL or bytes)
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
# wifi: CoreWLAN for the current network's name, signal and channel and for a scan (the names only show with Location Services, which the app asks for)
objc2-core-wlan = { version = "0.3", default-features = false, features = ["std", "CWWiFiClient", "CWInterface", "CWNetwork", "CWChannel", "CoreWLANTypes"] }

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4"
# calendar: localtime_r / mktime for khal's wall-clock dates
libc = "0.2"
# clipboard: X11 and Wayland (wlr-data-control) read/write without shelling out for every poll
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }

[dev-dependencies]
tempfile = "3"
