# Rosé Pine: Dawn for the light scheme, the main Rosé Pine for the dark one.
# Copy to ~/.config/pal/themes/ and set `theme_file = "rose-pine-dawn"`
# under [general] (or point `theme_file` at this path). Every key is a
# `--pal-*` token from docs/config.md; a key outside a section applies to
# both schemes. Saved changes apply live.
name = "Rosé Pine Dawn"

[light]
bg = "#faf4ed"
bg_glass = "rgba(250, 244, 237, 0.86)"
bg_elevated = "#fffaf3"
