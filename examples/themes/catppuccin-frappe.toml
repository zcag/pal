# Catppuccin: Frappé for the dark scheme, Latte for the light one.
# Copy to ~/.config/pal/themes/ and set `theme_file = "catppuccin-frappe"`
# under [general] (or point `theme_file` at this path). Every key is a
# `--pal-*` token from docs/config.md; a key outside a section applies to
# both schemes. Saved changes apply live.
name = "Catppuccin Frappé"

[dark]
bg = "#303446"
bg_glass = "rgba(48, 52, 70, 0.86)"
bg_elevated = "#414559"
