# What an extension repo of pal's own (zcag/pal-extensions, zcag/pal-games)
# runs after a green push to main (docs/design/repo-split.md, "Publishing:
# one signer"): builds every extension with pal-pack from the pal checkout
# the tests ran against, keeps those whose hash is not edge's newest build,
# uploads their packages to pal.cagdas.io and dispatches pal's
# extensions.yml with `{repo, ref, pal, builds}`. That run, the only holder
# of the signing key, builds them again from this commit, checks the hashes
# and the uploaded bytes, signs and publishes to edge. Nothing here is
# signed: a leaked token can put unsigned packages up, which no index lists.
#
# Needs a checkout of the repo (the workflow's commit) and of zcag/pal (at
# `pal`), Bun, and each extension's dependencies installed.
#
#   - uses: ./.pal/.github/actions/publish-extensions
#     with:
#       upload-token: ${{ secrets.PAL_UPLOAD_TOKEN }}
#       dispatch-token: ${{ secrets.PAL_DISPATCH_TOKEN }}
name: publish pal extensions
description: Build, upload and hand to pal's registry signer the extensions this push changed.
author: zcag

inputs:
  pal:
    description: The pal checkout the tests ran against (its pal-pack builds the packages).
    default: .pal
  upload-token:
    description: The site's upload-only bearer token (PAL_UPLOAD_TOKEN), which may PUT packages and nothing else.
    required: true
  dispatch-token:
    description: A token that may send zcag/pal a repository_dispatch (PAL_DISPATCH_TOKEN).
    required: true
  site:
    description: The registry's site.
    default: https://pal.cagdas.io
  signer:
    description: The repository whose extensions.yml signs and publishes.
    default: zcag/pal

outputs:
  builds:
    description: The builds handed to the signer, `name@hash` space separated; empty when nothing changed.
    value: ${{ steps.build.outputs.builds }}

runs:
  using: composite
  steps:
    - name: Build
      id: build
      shell: bash
      env:
        PAL: ${{ inputs.pal }}
        SITE: ${{ inputs.site }}
      run: |
        set -euo pipefail
        r=$PAL/.github/actions/registry/registry.sh W=$RUNNER_TEMP/pal-publish
        rm -rf "$W"; mkdir -p "$W"
        dirs=(); for d in */; do [ -f "$d/pal.json" ] && dirs+=("${d%/}"); done
        # The same flags as pal's own build, so the signer's build of this commit hashes the same.
        bun --no-install "$PAL/sdk/bin/pal-pack.ts" build "${dirs[@]}" --out "$W/all" \
          --seq "$(git show -s --format=%ct HEAD)" --commit "$(git rev-parse HEAD)" --screenshots-base "$SITE/extensions"
        $r fetch "$SITE/registry/edge/index.json" "$W/edge.json"
        $r changed "$W/all" "$W/edge.json" | tee "$W/changed.txt"
        builds=$(awk '$2 == "new" { print $1 }' "$W/changed.txt" | while read -r n; do printf '%s@%s ' "$n" "$(jq -r .build.hash "$W/all/$n.entry.json")"; done)
        echo "builds=${builds% }" >> "$GITHUB_OUTPUT"
        [ -n "$builds" ] || echo "nothing new: every build is edge's newest"

    - name: Upload
      if: steps.build.outputs.builds != ''
      shell: bash
      env:
        PAL: ${{ inputs.pal }}
        SITE: ${{ inputs.site }}
        BUILDS: ${{ steps.build.outputs.builds }}
        PAL_PUBLISH_TOKEN: ${{ inputs.upload-token }}
      run: |
        set -euo pipefail
        r=$PAL/.github/actions/registry/registry.sh W=$RUNNER_TEMP/pal-publish
        for b in $BUILDS; do
          n=${b%@*} h=${b#*@}
          $r put "$SITE/api/registry/pkg/$n/$h.tar.gz" "$W/all/$n.tar.gz"
          $r put "$SITE/api/registry/pkg/$n/$h.json" "$W/all/$n/pal.json"
        done

    - name: Dispatch
      if: steps.build.outputs.builds != ''
      shell: bash
      env:
        PAL: ${{ inputs.pal }}
        SIGNER: ${{ inputs.signer }}
        BUILDS: ${{ steps.build.outputs.builds }}
        TOKEN: ${{ inputs.dispatch-token }}
      run: |
        set -euo pipefail
        body=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "$(git rev-parse HEAD)" --arg pal "$(git -C "$PAL" rev-parse HEAD)" --arg builds "$BUILDS" \
          '{event_type: "publish-builds", client_payload: {repo: $repo, ref: $ref, pal: $pal, builds: ($builds | split(" "))}}')
        code=$(curl -sS -o "$RUNNER_TEMP/dispatch.out" -w '%{http_code}' -X POST "https://api.github.com/repos/$SIGNER/dispatches" \
          -H "Authorization: Bearer ${TOKEN:?the dispatch-token input is empty}" -H "Accept: application/vnd.github+json" -d "$body")
        [ "$code" = 204 ] || { echo "::error::dispatching $SIGNER: HTTP $code"; cat "$RUNNER_TEMP/dispatch.out"; exit 1; }
        echo "handed to https://github.com/$SIGNER/actions/workflows/extensions.yml: $BUILDS"
        {
          echo "## Handed to $SIGNER's registry signer"
          echo
          for b in $BUILDS; do echo "- \`${b%@*}\` \`${b#*@}\`"; done
          echo
          echo "edge has them once [extensions.yml](https://github.com/$SIGNER/actions/workflows/extensions.yml) is green."
        } >> "$GITHUB_STEP_SUMMARY"
