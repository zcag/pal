# Our registry (docs/registry.md "Our registry"): every extension built with
# pal-pack, signed with the extension key, published to pal.cagdas.io.
#
# - Every 15 minutes (or at once: run it with `publish`) it looks at the
#   main of pal's extension repos (zcag/pal-extensions, zcag/pal-games;
#   SOURCES below). A main whose `ci` run is green and that this workflow
#   has not taken yet is checked out at that commit, every extension in it
#   built here, and the ones whose hash is not edge's newest build go to
#   edge with that commit as their `commit`. A main that is pending or red
#   is left for a later run; a commit that is not a main's head is never
#   built. The repos hold no secret: everything is done here.
# - `make ext-release [NAMES="a b"]` dispatches `promote`: edge's newest
#   builds of those (or all) go to the stable index apps use.
# - release.yml dispatches `promote: all` for a tag, before it bundles
#   stable's builds of app/bundled.txt.
# - `yank: name@hash` marks a build yanked in both indexes; `reindex`
#   re-signs both and every build in them with the current key (a key
#   rotation, docs/releasing.md).
#
# The three jobs are split by what they may touch. `build` runs `bun
# install` (dependency scripts) and holds no secret. `sign` holds the
# extension key and installs nothing: bun runs pal-pack, which has no
# dependencies, with auto-install off. `publish` holds only the site token.
# The key and the token live in the `registry` environment.
#
# A run that finds nothing to do is a few API calls and ends green: a main
# taken already is remembered as a cache entry (`polled-<repo>-<commit>`),
# saved once its builds are on edge or it had none that were new.
name: extensions

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the extension repos' main now (what the schedule does), even a commit taken already"
        type: boolean
        default: false
      promote:
        description: "Promote edge to stable: all, or extension names (space or comma separated)"
        type: string
        default: ""
      yank:
        description: "name@hash to mark yanked in both indexes"
        type: string
        default: ""
      reindex:
        description: "Re-sign both indexes and every build in them with the current key"
        type: boolean
        default: false

# Each run reads an index, adds to it and writes it back, so runs go one at a
# time and none is cancelled halfway. GitHub keeps one pending run per
# group: a third run arriving cancels the one waiting, not the one running.
# For edge that loses nothing (the next poll takes what is still new); a
# cancelled promote shows as a failed `make ext-release` or release job,
# to run again.
concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # the polled-<repo>-<commit> cache entries

env:
  SITE: https://pal.cagdas.io
  BASE: https://pal.cagdas.io/registry
  # The repos whose main is published (owner/name, space separated). Each
  # has a workflow named `ci` whose green run on the commit is required.
  SOURCES: zcag/pal-extensions zcag/pal-games

jobs:
  build:
    # Forks have no key and no site; a schedule there does nothing.
    if: github.repository == 'zcag/pal'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      built: ${{ steps.plan.outputs.built }}
      work: ${{ steps.plan.outputs.work }}
      # The repos' commits this run takes (empty: none), saved as taken once on edge.
      extensions: ${{ steps.todo.outputs.extensions }}
      games: ${{ steps.todo.outputs.games }}
    env:
      # A dispatch that promotes, yanks or re-signs publishes what is already
      # built; the schedule and `publish` poll the repos.
      POLL: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Each repo's main head and its `ci` run there: `<repo> <commit>` for
      # a green one, nothing for one pending, red or not answering (a later
      # run looks again; a scheduled run never fails on it).
      - name: Poll
        if: env.POLL == 'true'
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=()
          for repo in $SOURCES; do
            sha=$(gh api "repos/$repo/commits/main" --jq .sha 2>/dev/null) || { echo "::notice::$repo: main not read, skipped"; continue; }
            run=$(gh api "repos/$repo/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&per_page=10" \
              --jq '[.workflow_runs[]] | sort_by(.run_number) | last | "\(.status) \(.conclusion)"' 2>/dev/null) || run="unknown"
            echo "$repo@${sha:0:10}: ci ${run:-none}"
            [ "$run" = "completed success" ] && green+=("$repo $sha")
          done
          slot() { for g in "${green[@]}"; do [ "${g%% *}" = "$1" ] && echo "${g#* }"; done; }
          echo "extensions=$(slot zcag/pal-extensions)" >> "$GITHUB_OUTPUT"
          echo "games=$(slot zcag/pal-games)" >> "$GITHUB_OUTPUT"
      # Whether a run took that commit already.
      - uses: actions/cache/restore@v4
        if: steps.poll.outputs.extensions != ''
        id: seen-extensions
        with:
          path: ${{ runner.temp }}/polled
          key: polled-pal-extensions-${{ steps.poll.outputs.extensions }}
          lookup-only: true
      - uses: actions/cache/restore@v4
        if: steps.poll.outputs.games != ''
        id: seen-games
        with:
          path: ${{ runner.temp }}/polled
          key: polled-pal-games-${{ steps.poll.outputs.games }}
          lookup-only: true
      # What this run builds: a green main not taken yet, or any green main
      # when `publish` asks. `taken` names the cache entries to save once
      # its builds are out.
      - name: To build
        if: env.POLL == 'true'
        id: todo
        env:
          EXT: ${{ steps.poll.outputs.extensions }}
          GAMES: ${{ steps.poll.outputs.games }}
          EXT_SEEN: ${{ steps.seen-extensions.outputs.cache-hit }}
          GAMES_SEEN: ${{ steps.seen-games.outputs.cache-hit }}
          FORCE: ${{ inputs.publish }}
        run: |
          taken=""
          if [ -n "$EXT" ] && { [ "$FORCE" = true ] || [ "$EXT_SEEN" != true ]; }; then echo "extensions=$EXT" >> "$GITHUB_OUTPUT"; taken="$taken polled-pal-extensions-$EXT"; fi
          if [ -n "$GAMES" ] && { [ "$FORCE" = true ] || [ "$GAMES_SEEN" != true ]; }; then echo "games=$GAMES" >> "$GITHUB_OUTPUT"; taken="$taken polled-pal-games-$GAMES"; fi
          echo "taken=${taken# }" >> "$GITHUB_OUTPUT"
          [ -n "$taken" ] && echo "building:$taken" || echo "nothing new on the repos' main"

      - uses: actions/checkout@v4
        if: steps.todo.outputs.extensions != ''
        with:
          repository: zcag/pal-extensions
          ref: ${{ steps.todo.outputs.extensions }}
          path: src/pal-extensions
          # The whole history: a listing's `released` is the first commit that added the extension's pal.json (pal-pack).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.todo.outputs.games != ''
        with:
          repository: zcag/pal-games
          ref: ${{ steps.todo.outputs.games }}
          path: src/pal-games
          # The whole history: a listing's `released` is the first commit that added the extension's pal.json (pal-pack).
          fetch-depth: 0
          persist-credentials: false

      # The same Bun as ci.yml and the app's sidecar (fetch-bun.sh pins it).
      - name: Bun version
        if: steps.todo.outputs.taken != ''
        id: bun
        run: echo "version=$(sed -n 's/^BUN_VERSION=//p' app/scripts/fetch-bun.sh)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: steps.todo.outputs.taken != ''
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - uses: actions/cache@v4
        if: steps.todo.outputs.taken != ''
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install JS dependencies
        if: steps.todo.outputs.taken != ''
        run: |
          for d in src/*/*/; do
            if [ -f "$d/package.json" ]; then (cd "$d" && bun install --frozen-lockfile); fi
          done

      # Every extension in each repo at its commit, with its statement.
      # `seq` is the commit's time (docs/registry.md). Staged at
      # extensions/<name> (pal-pack --prefix), the source paths in the
      # output are the ones pal's own builds had, so an extension that did
      # not change keeps its hash.
      - name: Build
        if: steps.todo.outputs.taken != ''
        run: |
          set -euo pipefail
          R=$RUNNER_TEMP/registry
          for src in src/*/; do
            dirs=(); for d in "$src"*/; do [ -f "$d/pal.json" ] && dirs+=("${d%/}"); done
            bun --no-install sdk/bin/pal-pack.ts build "${dirs[@]}" --prefix extensions --out "$R/all" \
              --seq "$(git -C "$src" show -s --format=%ct HEAD)" --commit "$(git -C "$src" rev-parse HEAD)" \
              --screenshots-base "$SITE/extensions" > /dev/null
            echo "### $(basename "$src")@$(git -C "$src" rev-parse --short=10 HEAD): ${#dirs[@]} extensions built" >> "$GITHUB_STEP_SUMMARY"
          done
          bun --no-install sdk/bin/pal-pack.ts statements "$R/all" > /dev/null
          .github/actions/registry/registry.sh fetch "$BASE/edge/index.json" "$R/edge.json"
          .github/actions/registry/registry.sh changed "$R/all" "$R/edge.json" > "$R/changed.txt"
          rm -f "$R/edge.json" "$R/edge.json.minisig"
          awk '$2 == "new" { print "- `" $1 "`" } $2 == "listing" { print "- `" $1 "` (listing only)" }' "$R/changed.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Plan
        id: plan
        env:
          ACT: ${{ inputs.promote }}${{ inputs.yank }}${{ inputs.reindex && 'reindex' || '' }}
        run: |
          R=$RUNNER_TEMP/registry
          if [ -f "$R/changed.txt" ]; then
            # A new listing of the newest build goes through the index too (pal-pack's addBuild takes it): no new package.
            awk '$2 == "new" || $2 == "listing" { print $1 }' "$R/changed.txt" > "$R/new.txt"
            echo "$(wc -l < "$R/new.txt") of $(wc -l < "$R/changed.txt") extensions are not edge's newest build"
          fi
          if [ -s "$R/new.txt" ] || [ -n "$ACT" ]; then echo "work=true" >> "$GITHUB_OUTPUT"; else echo "nothing to publish"; fi
          if [ -f "$R/changed.txt" ]; then echo "built=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.work == 'true' && steps.plan.outputs.built == 'true'
        with:
          name: built
          path: ${{ runner.temp }}/registry
          retention-days: 7
      # Built, and nothing in it new: taken.
      - name: Remember the commits
        if: steps.todo.outputs.taken != '' && steps.plan.outputs.work != 'true'
        run: mkdir -p "$RUNNER_TEMP/polled" && touch "$RUNNER_TEMP/polled/taken"
      - uses: actions/cache/save@v4
        if: steps.todo.outputs.extensions != '' && steps.plan.outputs.work != 'true'
        with:
          path: ${{ runner.temp }}/polled
          key: polled-pal-extensions-${{ steps.todo.outputs.extensions }}
      - uses: actions/cache/save@v4
        if: steps.todo.outputs.games != '' && steps.plan.outputs.work != 'true'
        with:
          path: ${{ runner.temp }}/polled
          key: polled-pal-games-${{ steps.todo.outputs.games }}

  sign:
    needs: build
    if: needs.build.outputs.work == 'true'
    runs-on: ubuntu-24.04
    environment: registry
    env:
      # The public keys the live indexes may be signed with (space
      # separated): the current one, and the old one during a rotation. The
      # first is written into the indexes as their `key`.
      PUBKEYS: ${{ vars.PAL_REGISTRY_PUBKEYS }}
      NEXT_KEY: ${{ vars.PAL_REGISTRY_NEXT_KEY }}
      PROMOTE: ${{ inputs.promote }}
      YANK: ${{ inputs.yank }}
      REINDEX: ${{ inputs.reindex }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - name: Bun version
        id: bun
        run: echo "version=$(sed -n 's/^BUN_VERSION=//p' app/scripts/fetch-bun.sh)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      # Ubuntu's own package (universe, 0.11 on noble), from the runner's
      # apt mirror.
      - name: minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends minisign
      - uses: actions/download-artifact@v4
        if: needs.build.outputs.built == 'true'
        with:
          name: built
          path: ${{ runner.temp }}/registry
      - name: Key
        env:
          KEY: ${{ secrets.PAL_REGISTRY_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::PAL_REGISTRY_KEY is not set in the registry environment (docs/releasing.md)"; exit 1; }
          [ -n "$PUBKEYS" ] || { echo "::error::PAL_REGISTRY_PUBKEYS is not set in the registry environment (docs/releasing.md)"; exit 1; }
          (umask 077; printf '%s\n' "$KEY" > "$RUNNER_TEMP/registry.key")

      # Out: out/edge (index, signature, the new packages) and out/stable
      # (index, signature), each only when it changes; out/before keeps the
      # indexes as they were, for the summary.
      - name: Sign and index
        run: |
          set -euo pipefail
          r=.github/actions/registry/registry.sh
          pack() { bun --no-install sdk/bin/pal-pack.ts "$@"; }
          R=$RUNNER_TEMP/registry key=$RUNNER_TEMP/registry.key
          mkdir -p "$R/out/before" "$R/empty" "$R/dist"
          # An unset PAL_REGISTRY_NEXT_KEY clears the indexes' next_key.
          opts=(--name pal --base "$BASE" --key "${PUBKEYS%% *}" --next-key "$NEXT_KEY")
          [ -z "$YANK" ] || opts+=(--yank "$YANK")

          for ch in edge stable; do
            $r fetch "$BASE/$ch/index.json" "$R/$ch.json"
            if [ -f "$R/$ch.json" ]; then
              cp "$R/$ch.json" "$R/out/before/"
              # `reindex`, or the first run after a key swap (the index is
              # signed by an old key): every build is re-signed, and both
              # indexes go out signed with the current key.
              if [ "$REINDEX" = true ]; then $r resign "$R/$ch.json" "$key"
              elif [ "$($r rekey "$R/$ch.json" "$key")" = rekeyed ]; then REINDEX=true
              fi
            fi
          done

          if [ -d "$R/all" ]; then
            shopt -s nullglob
            $r sign "$key" "$R"/all/*.statement
            $r pick "$R/all" "$R/dist" "$R/new.txt"
          fi
          if [ -s "$R/new.txt" ] || [ -n "$YANK" ] || [ "$REINDEX" = true ]; then
            m=(); [ ! -f "$R/edge.json" ] || m=(--merge "$R/edge.json")
            pack index "$R/dist" "${opts[@]}" "${m[@]}" --out "$R/out/edge"
            $r sign "$key" "$R/out/edge/index.json"
          fi

          if [ -n "$PROMOTE" ]; then
            if [ -f "$R/out/edge/index.json" ]; then from=$R/out/edge/index.json; else from=$R/edge.json; fi
            [ -f "$from" ] || { echo "::error::no edge index to promote from"; exit 1; }
            [ -f "$R/stable.json" ] || jq -n '{format: 1, name: "pal", generated_at: "1970-01-01T00:00:00Z", next_key: null, extensions: []}' > "$R/stable.json"
            names=()
            [ "$PROMOTE" = all ] || names=(--names "$(sed -E 's/[ ,]+/,/g; s/^,|,$//g' <<< "$PROMOTE")")
            pack promote --from "$from" --to "$R/stable.json" "${names[@]}" --out "$R/stable.promoted.json"
            mv "$R/stable.promoted.json" "$R/stable.json"
          fi
          # Through pal-pack index once more, with nothing new, so stable
          # gets the yank, next_key and generated_at the same way edge does.
          if [ -n "$PROMOTE" ] || [ -n "$YANK" ] || [ "$REINDEX" = true ]; then
            m=(); [ ! -f "$R/stable.json" ] || m=(--merge "$R/stable.json")
            pack index "$R/empty" "${opts[@]}" "${m[@]}" --out "$R/out/stable"
            $r sign "$key" "$R/out/stable/index.json"
          fi

          ls "$R"/out/*/index.json > /dev/null 2>&1 || { echo "::error::nothing was indexed"; exit 1; }
          for f in "$R"/out/*/index.json; do $r verify "$f"; done
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/registry.key"
      - uses: actions/upload-artifact@v4
        with:
          name: signed
          path: ${{ runner.temp }}/registry/out
          retention-days: 7

  publish:
    needs: [build, sign]
    if: needs.build.outputs.work == 'true'
    runs-on: ubuntu-24.04
    environment: registry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/registry
      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: ${{ runner.temp }}/signed
      # Packages first, then edge, then stable: an index never lists a
      # package the site does not have yet. Each index is read back from
      # its public URL, what apps fetch, and compared byte for byte.
      - name: Upload
        env:
          PAL_PUBLISH_TOKEN: ${{ secrets.PAL_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          r=.github/actions/registry/registry.sh S=$RUNNER_TEMP/signed
          shopt -s nullglob
          for f in "$S"/edge/pkg/*/*; do
            $r put "$SITE/api/registry/pkg/$(basename "$(dirname "$f")")/$(basename "$f")" "$f"
          done
          for ch in edge stable; do
            [ -f "$S/$ch/index.json" ] || continue
            jq -n --rawfile index "$S/$ch/index.json" --rawfile sig "$S/$ch/index.json.minisig" \
              '{index: $index, sig: $sig}' > "$RUNNER_TEMP/$ch.body.json"
            $r put "$SITE/api/registry/$ch" "$RUNNER_TEMP/$ch.body.json"
            curl -fsS "$BASE/$ch/index.json" | cmp - "$S/$ch/index.json"
            curl -fsS "$BASE/$ch/index.json.minisig" | cmp - "$S/$ch/index.json.minisig"
            echo "$BASE/$ch/index.json is live"
          done
      # The repos' commits whose builds are now on edge: taken.
      - name: Remember the commits
        if: needs.build.outputs.extensions != '' || needs.build.outputs.games != ''
        run: mkdir -p "$RUNNER_TEMP/polled" && touch "$RUNNER_TEMP/polled/taken"
      - uses: actions/cache/save@v4
        if: needs.build.outputs.extensions != ''
        with:
          path: ${{ runner.temp }}/polled
          key: polled-pal-extensions-${{ needs.build.outputs.extensions }}
      - uses: actions/cache/save@v4
        if: needs.build.outputs.games != ''
        with:
          path: ${{ runner.temp }}/polled
          key: polled-pal-games-${{ needs.build.outputs.games }}
      - name: Summary
        env:
          YANK: ${{ inputs.yank }}
          REINDEX: ${{ inputs.reindex }}
          EXT: ${{ needs.build.outputs.extensions }}
          GAMES: ${{ needs.build.outputs.games }}
        run: |
          r=.github/actions/registry/registry.sh S=$RUNNER_TEMP/signed
          {
            echo "## Registry at \`${{ needs.build.outputs.sha }}\`${EXT:+, pal-extensions@\`${EXT:0:10}\`}${GAMES:+, pal-games@\`${GAMES:0:10}\`}"
            for ch in edge stable; do
              [ -f "$S/$ch/index.json" ] || continue
              echo; echo "### $ch"; echo
              $r summary "$S/before/$ch.json" "$S/$ch/index.json"
            done
            [ -z "$YANK" ] || printf '\n%s\n' "Yanked \`$YANK\` in both indexes."
            [ "$REINDEX" != true ] || printf '\nRe-signed both indexes and every build in them.\n'
          } >> "$GITHUB_STEP_SUMMARY"
