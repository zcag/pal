# Every push and pull request: the checks from README "Checks" plus the
# test suites, on the two platforms pal ships for. No bundle here; that is
# release.yml. Budget is ~10 min warm: cargo via rust-cache, npm via
# setup-node, bun's package cache and the fetched bun sidecar via
# actions/cache (build.rs downloads it once per target otherwise). The
# extensions are zcag/pal-extensions' and zcag/pal-games' (their own CI runs
# all of their tests against pal's main); here checkouts of both at main
# are what the host's contract tests, the gallery and the Rust tests that
# read manifests run over, as beside a checkout at home, and the bundled
# extensions' tests run with the host's, so a change to pal that breaks one
# fails here.
name: ci

on:
  push:
    branches: ["**"]  # every branch; a tag push is release.yml's
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # app/scripts/extension-repos.mjs and pal_core::extensions::dev read it.
      PAL_EXTENSION_REPOS: ${{ github.workspace }}/.ext/pal-extensions:${{ github.workspace }}/.ext/pal-games
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zcag/pal-extensions
          ref: main
          path: .ext/pal-extensions
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zcag/pal-games
          ref: main
          path: .ext/pal-games
          persist-credentials: false

      # Tauri v2's Debian list (https://tauri.app/start/prerequisites/#linux).
      # libwebkit2gtk-4.1-dev pulls gtk3, soup3, javascriptcore and the
      # wayland dev packages; the core's own Linux deps (arboard over
      # wl-clipboard-rs/x11rb, freedesktop-icons, resvg, bundled rusqlite,
      # zbus) are pure Rust or dlopen at runtime, so nothing is added.
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Pinned (release.yml too): a new stable brings new clippy lints that
      # nobody ran locally (1.98 turned the tree red on chunks_exact_to_as_chunks
      # while every box was on 1.97). Bump both workflows together.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The same Bun release the app ships as its sidecar (fetch-bun.sh
      # pins it), so the host tests run on what users get.
      - name: Bun version
        id: bun
        run: echo "version=$(sed -n 's/^BUN_VERSION=//p' app/scripts/fetch-bun.sh)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun sidecar
        uses: actions/cache@v4
        with:
          path: app/src-tauri/binaries
          key: sidecar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/fetch-bun.sh') }}
      # The MediaRemote adapter build.rs builds on macOS (fetch-mediaremote.sh:
      # a git clone and a cmake build, ~10 s); the runner image ships cmake.
      - name: MediaRemote adapter
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: app/src-tauri/mediaremote
          key: mediaremote-${{ runner.os }}-${{ hashFiles('app/scripts/fetch-mediaremote.sh') }}
      - name: cmake
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake

      # The root `bun install` links the workspace (host/, sdk/ and the
      # `@zcag/pal` name); the extensions' own dependencies are installed in
      # the checkouts, which find `@zcag/pal` up the tree, here.
      - name: Install JS dependencies
        run: |
          (cd app && npm ci)
          bun install --frozen-lockfile
          for d in .ext/*/*/; do
            if [ -f "$d/package.json" ]; then (cd "$d" && bun install --frozen-lockfile); fi
          done

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `#[ignore]` covers what needs a real session: a pasteboard, an
      # unlocked keychain, the ranking fixture corpus.
      - name: cargo test
        run: cargo test --workspace
      # The app crate through build.rs and tauri-build, without bundling.
      - name: cargo build (app)
        run: cargo build -p pal

      - name: app typecheck and tests
        working-directory: app
        # The gallery imports `@zcag/pal` types from sdk/dist, so the SDK builds first; it reads the extensions' manifests from the checkout.
        run: |
          npm --prefix ../sdk run build
          npx tsc --noEmit
          npx vitest run
      # host/tsconfig.json includes ../sdk/src and ../examples, so this
      # typechecks them too; tsconfig.surface.json the examples' surface
      # pages, which run in the webview (DOM). The tests: the host's own and
      # the bundled extensions' (app/scripts/extension-repos.mjs bundled-tests).
      - name: host typecheck and tests
        working-directory: host
        run: |
          bunx tsc --noEmit
          bunx tsc --noEmit -p tsconfig.surface.json
          bundled=$(bun ../app/scripts/extension-repos.mjs bundled-tests)
          # shellcheck disable=SC2086 # one path a line, none with a space
          bun test --parallel --reporter=junit --reporter-outfile="$RUNNER_TEMP/host-tests.xml" test/*.test.ts $bundled
          bun test/budget.ts "$RUNNER_TEMP/host-tests.xml"
      # The published package: its declarations build, and the tarball
      # holds only what `files` lists.
      - name: sdk build and pack
        working-directory: sdk
        run: |
          bun run build
          npm pack --dry-run
