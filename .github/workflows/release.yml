# A `v*` tag: bundle pal for every platform and put the bundles on a draft
# GitHub release named after the tag, notes from the commit subjects since
# the previous tag (there is no CHANGELOG; the draft is edited by hand).
# Nothing is public until the draft is published by hand; docs/releasing.md
# has the checklist. `make release VERSION=x.y.z` bumps the versions, commits,
# tags and pushes; the guard below refuses a tag that does not match
# tauri.conf.json. The `manifest` job then checks that latest.json carries
# all three platforms (the three jobs merge into one file in parallel).
name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled on the same arm64 runner: build.rs fetches the
          # x64 bun sidecar for this target, the JS side is arch-neutral.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every tag and the history: the notes step

      - name: Tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(jq -r .version app/src-tauri/tauri.conf.json)
          [ "v$v" = "$TAG" ] || { echo "tag $TAG but tauri.conf.json says $v (run make release VERSION=...)"; exit 1; }

      # One bullet per commit since the previous v* tag reachable from this
      # one (every commit when there is none: the pali branch shares no
      # history with the v1 tags). GitHub's own generated notes list pull
      # requests, and this repo has none.
      - name: Release notes from the commits
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          {
            echo "body<<PAL_NOTES_EOF"
            git log --no-merges --format='- %s' "${prev:+$prev..}$TAG"
            if [ -n "$prev" ]; then
              echo
              echo "Full changelog: https://github.com/${{ github.repository }}/compare/$prev...$TAG"
            fi
            echo "PAL_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # ci.yml's list (https://tauri.app/start/prerequisites/#linux) plus
      # patchelf, which tauri-action's own example installs for the AppImage
      # step. The .deb declares libwebkit2gtk-4.1-0 and libgtk-3-0 of this
      # runner's Ubuntu as its dependencies; the AppImage bundles them.
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Pinned to what ci.yml checks with (and what hornet's Homebrew rustc
      # is): a release is built by the compiler CI tested. Bump both
      # workflows together.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Bun version
        id: bun
        run: echo "version=$(sed -n 's/^BUN_VERSION=//p' app/scripts/fetch-bun.sh)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun sidecar
        uses: actions/cache@v4
        with:
          path: app/src-tauri/binaries
          key: sidecar-${{ matrix.target }}-${{ hashFiles('app/scripts/fetch-bun.sh') }}
      # The MediaRemote adapter (ci.yml has the note); one universal build
      # serves both macOS targets.
      - name: MediaRemote adapter
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: app/src-tauri/mediaremote
          key: mediaremote-${{ runner.os }}-${{ hashFiles('app/scripts/fetch-mediaremote.sh') }}
      - name: cmake
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake

      # build-extensions.sh (beforeBuildCommand) bundles each extension with
      # bun, so their dependencies must be installed.
      - name: Install JS dependencies
        run: |
          (cd app && npm ci)
          bun install --frozen-lockfile
          for d in extensions/*/; do
            if [ -f "$d/package.json" ]; then (cd "$d" && bun install --frozen-lockfile); fi
          done

      # The updater signature is optional: without the secret the build still
      # ships, only the `.tar.gz`/`.sig` pair and latest.json are left out
      # (tauri build fails on an empty key, so the flag is turned off, not
      # the env var).
      - name: Updater signing
        id: sign
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: no updater artifacts or latest.json for this release"
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "args=--config $RUNNER_TEMP/no-updater.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy ships its own old `strip`, which rejects libraries
          # with `.relr.dyn` sections (what current binutils emit; the bundle
          # failed on Arch without this, notes/linux.md). Whether Ubuntu
          # 24.04's libraries carry them is untested, and the flag costs
          # nothing here: Debian ships its libraries stripped and the pal
          # binary is stripped by the release profile (`strip = true`), so
          # skipping linuxdeploy's pass only removes a failure mode.
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}
          # macOS stays ad-hoc signed (bundle.macOS.signingIdentity "-") until
          # a Developer ID exists. Then: set signingIdentity to it (the env
          # only applies when the config leaves it unset), hardenedRuntime
          # true with entitlements for the bun sidecar's JIT, and uncomment:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: ${{ steps.notes.outputs.body }}
          args: --target ${{ matrix.target }} ${{ steps.sign.outputs.args }}
          uploadUpdaterJson: ${{ steps.sign.outputs.enabled == 'true' }}

  # The three jobs each download latest.json from the draft, add their
  # platform and upload it again (tauri-action's upload-version-json.ts),
  # so two finishing at once can drop a platform. This reads the merged
  # file back and fails when a platform is missing: re-run the missing
  # platform's job, which merges its entry in again.
  manifest:
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: latest.json has every platform
        run: |
          if [ -z "$KEY" ]; then echo "no signing key: no latest.json to check"; exit 0; fi
          # gh finds the draft by tag with the token (a draft has no /releases/tags entry).
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > release.json
          jq -r '.assets[].name' release.json | sort | tee assets.txt
          for want in latest.json aarch64.app.tar.gz aarch64.app.tar.gz.sig x64.app.tar.gz x64.app.tar.gz.sig amd64.AppImage amd64.AppImage.sig aarch64.dmg x64.dmg amd64.deb; do
            grep -q -- "$want"'$' assets.txt || { echo "::error::missing asset *$want"; fail=1; }
          done
          url=$(jq -r '.assets[] | select(.name == "latest.json") | .apiUrl' release.json)
          [ -n "$url" ] || exit 1
          gh api -H "Accept: application/octet-stream" "$url" > latest.json
          jq . latest.json
          for p in darwin-aarch64 darwin-x86_64 linux-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].signature' latest.json > /dev/null || { echo "::error::latest.json has no $p entry"; fail=1; }
          done
          v=$(jq -r .version latest.json)
          [ "v$v" = "$TAG" ] || { echo "::error::latest.json says version $v, tag is $TAG"; fail=1; }
          exit "${fail:-0}"
