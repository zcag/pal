# A `v*` tag: bundle pal for every platform and put the bundles on the draft
# GitHub release named after the tag, which `make release` created with its
# notes (docs/changelog.md's section, then the commits). The draft is published, as the
# latest release, only once every bundle is on it; docs/releasing.md has the
# rest. `make release VERSION=x.y.z` bumps the versions, commits,
# tags and pushes; the guard below refuses a tag that does not match
# tauri.conf.json. `extensions` (extensions.yml) first promotes everything
# on the registry's edge index to stable; the bundles then take each
# bundled extension's stable build (build-extensions.sh). The `manifest` job checks that latest.json carries
# all three platforms (the three jobs merge into one file in parallel) and
# that stable lists every bundled extension's build, and publishes.
#
# A push to main that changes the dependencies runs the same build without
# bundling or releasing (`warm`): it saves the Rust cache, and a tag run can
# restore only its own caches and main's. Without it every release compiled
# every crate from nothing (~4 of the ~12 min a macOS job spends in cargo;
# the rest is pal's crates and fat LTO, which no cache skips).
name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["Cargo.lock", "**/Cargo.toml", ".github/workflows/release.yml"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every extension's newest edge build goes to stable (extensions.yml)
  # before anything is bundled: a release is everything that was tried on
  # edge, the bundles take those builds, and the registry never offers one
  # older than the app has. The extensions are built and put on edge from
  # zcag/pal-extensions and zcag/pal-games, not at this tag. Only
  # the `registry` environment's secrets reach it: nothing is passed, so the
  # updater key stays in this workflow. extensions.yml dispatched, not
  # called: a called workflow does not get the `registry` environment's
  # secrets (v0.8.0's sign job had no key), a dispatched run does. This job
  # waits for it.
  extensions:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: promote edge to stable (extensions.yml)
        run: |
          before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run extensions.yml --ref main -f promote=all
          for _ in $(seq 36); do
            id=$(gh run list --workflow extensions.yml --event workflow_dispatch --limit 5 --json databaseId,createdAt -q "[.[] | select(.createdAt >= \"$before\")][-1].databaseId")
            [ -n "$id" ] && break
            sleep 5
          done
          [ -n "$id" ] || { echo "::error::the dispatched extensions.yml run did not appear"; exit 1; }
          echo "extensions.yml run: https://github.com/$GH_REPO/actions/runs/$id"
          gh run watch "$id" --exit-status --interval 20 > /dev/null

  bundle:
    needs: extensions
    # A push to main skips `extensions` and still warms the cache.
    if: ${{ !cancelled() && (github.ref_type != 'tag' || needs.extensions.result == 'success') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled on the same arm64 runner: build.rs fetches the
          # x64 bun sidecar for this target, the JS side is arch-neutral.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(jq -r .version app/src-tauri/tauri.conf.json)
          [ "v$v" = "$TAG" ] || { echo "tag $TAG but tauri.conf.json says $v (run make release VERSION=...)"; exit 1; }

      # ci.yml's list (https://tauri.app/start/prerequisites/#linux) plus
      # patchelf, which tauri-action's own example installs for the AppImage
      # step. The .deb declares libwebkit2gtk-4.1-0 and libgtk-3-0 of this
      # runner's Ubuntu as its dependencies; the AppImage bundles them.
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Pinned to what ci.yml checks with (and what hornet's Homebrew rustc
      # is): a release is built by the compiler CI tested. Bump both
      # workflows together.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      # Saved by main's warm runs only: a tag's cache is seen by that tag alone.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref_type != 'tag' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Bun version
        id: bun
        run: echo "version=$(sed -n 's/^BUN_VERSION=//p' app/scripts/fetch-bun.sh)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Bun sidecar
        uses: actions/cache@v4
        with:
          path: app/src-tauri/binaries
          key: sidecar-${{ matrix.target }}-${{ hashFiles('app/scripts/fetch-bun.sh') }}
      # The MediaRemote adapter (ci.yml has the note); one universal build
      # serves both macOS targets.
      - name: MediaRemote adapter
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: app/src-tauri/mediaremote
          key: mediaremote-${{ runner.os }}-${{ hashFiles('app/scripts/fetch-mediaremote.sh') }}
      - name: cmake
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake

      - name: Install JS dependencies
        run: |
          (cd app && npm ci)
          bun install --frozen-lockfile
      # build-extensions.sh (beforeBuildCommand) takes the bundled extensions'
      # stable builds from the registry and checks them with minisign.
      - name: minisign
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y -qq --no-install-recommends minisign; else brew install minisign; fi

      # The updater signature is optional: without the secret the build still
      # ships, only the `.tar.gz`/`.sig` pair and latest.json are left out
      # (tauri build fails on an empty key, so the flag is turned off, not
      # the env var).
      - name: Updater signing
        id: sign
        if: github.ref_type == 'tag'
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: no updater artifacts or latest.json for this release"
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "args=--config $RUNNER_TEMP/no-updater.json" >> "$GITHUB_OUTPUT"
          fi

      # Every macOS pal is signed with the one `pal-dev` identity (a local
      # build too: `make app`), so an update keeps the Accessibility and
      # other grants, which an ad-hoc signature (the build's own hash) lost
      # each time. tauri's own APPLE_CERTIFICATE import only resolves Apple's
      # certificate names, so the script imports it and the config names it.
      # A release is never ad-hoc: no secret, no build.
      - name: Code signing (pal-dev)
        id: codesign
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        env:
          P12: ${{ secrets.PAL_DEV_P12 }}
          PW: ${{ secrets.PAL_DEV_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "::error::PAL_DEV_P12 is not set: a release is signed with pal-dev (docs/releasing.md)"; exit 1; }
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/pal-dev.p12"
          app/scripts/signing-key.sh "$RUNNER_TEMP/pal-dev.p12" "$PW"
          rm "$RUNNER_TEMP/pal-dev.p12"
          echo '{"bundle":{"macOS":{"signingIdentity":"pal-dev"}}}' > "$RUNNER_TEMP/codesign.json"
          echo "args=--config $RUNNER_TEMP/codesign.json" >> "$GITHUB_OUTPUT"

      # main: the build alone, for the cache.
      - name: Warm the Rust cache
        if: github.ref_type != 'tag'
        working-directory: app
        run: npx tauri build --target ${{ matrix.target }} --no-bundle --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: tauri-apps/tauri-action@v1
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy ships its own old `strip`, which rejects libraries
          # with `.relr.dyn` sections (what current binutils emit; the bundle
          # failed on Arch without this, notes/linux.md). Whether Ubuntu
          # 24.04's libraries carry them is untested, and the flag costs
          # nothing here: Debian ships its libraries stripped and the pal
          # binary is stripped by the release profile (`strip = true`), so
          # skipping linuxdeploy's pass only removes a failure mode.
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}
          # macOS is signed with pal-dev (above), not notarised. With a
          # Developer ID: sign with it instead (the env only applies when the
          # config leaves signingIdentity unset), hardenedRuntime true with
          # entitlements for the bun sidecar's JIT, and uncomment:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          args: --target ${{ matrix.target }} ${{ steps.sign.outputs.args }} ${{ steps.codesign.outputs.args }}
          uploadUpdaterJson: ${{ steps.sign.outputs.enabled == 'true' }}

      # What the bundle ships of each extension: the tree hash pal-pack gave
      # the bundled copy (build-extensions.sh writes `.pal-build.json` beside
      # its manifest). The `manifest` job holds it against the registry.
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' && matrix.target == 'aarch64-apple-darwin'
        with:
          name: bundled-builds
          path: app/src-tauri/resources/extensions/*/.pal-build.json
          include-hidden-files: true
          if-no-files-found: error

  # The three jobs each download latest.json from the draft, add their
  # platform and upload it again (tauri-action's upload-version-json.ts),
  # so two finishing at once can drop a platform. This reads the merged
  # file back and fails when a platform is missing: re-run the missing
  # platform's job, which merges its entry in again.
  manifest:
    needs: [bundle, extensions]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - name: latest.json has every platform
        run: |
          if [ -z "$KEY" ]; then echo "no signing key: no latest.json to check"; exit 0; fi
          # gh finds the draft by tag with the token (a draft has no /releases/tags entry).
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > release.json
          jq -r '.assets[].name' release.json | sort | tee assets.txt
          for want in latest.json aarch64.app.tar.gz aarch64.app.tar.gz.sig x64.app.tar.gz x64.app.tar.gz.sig amd64.AppImage amd64.AppImage.sig aarch64.dmg x64.dmg amd64.deb; do
            grep -q -- "$want"'$' assets.txt || { echo "::error::missing asset *$want"; fail=1; }
          done
          url=$(jq -r '.assets[] | select(.name == "latest.json") | .apiUrl' release.json)
          [ -n "$url" ] || exit 1
          gh api -H "Accept: application/octet-stream" "$url" > latest.json
          jq . latest.json
          for p in darwin-aarch64 darwin-x86_64 linux-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].signature' latest.json > /dev/null || { echo "::error::latest.json has no $p entry"; fail=1; }
          done
          v=$(jq -r .version latest.json)
          [ "v$v" = "$TAG" ] || { echo "::error::latest.json says version $v, tag is $TAG"; fail=1; }
          exit "${fail:-0}"
      # Every bundled extension's hash is a build stable lists, not yanked
      # (build-extensions.sh takes them from stable, so this holds by
      # construction; it stays as the check): an app compares its bundled copy with the registry by hash, so a
      # bundle the registry lacks would offer an "update" to what it already
      # runs, or hide a real one. The hash, not the commit: a tree that did
      # not change since the last promotion keeps the build (and commit) it
      # was first promoted with.
      - uses: actions/download-artifact@v4
        with:
          name: bundled-builds
          path: bundled
      - name: bundled builds are in the registry
        run: |
          curl -fsS https://pal.cagdas.io/registry/stable/index.json > stable.json
          for f in bundled/*/.pal-build.json; do
            n=$(basename "$(dirname "$f")"); h=$(jq -r .hash "$f"); count=$((${count:-0} + 1))
            jq -e --arg n "$n" --arg h "$h" \
              'any(.extensions[] | select(.name == $n) | .builds[]; .hash == $h and (.yanked | not))' stable.json > /dev/null ||
              { echo "::error::$n: the bundle has $h, which stable does not list (or yanked)"; fail=1; }
          done
          [ -n "${fail:-}" ] || echo "all $count bundled extensions match stable"
          exit "${fail:-0}"
      # Only a complete release goes public, and always as the latest: the
      # updater and the site's Download buttons both follow releases/latest.
      - name: publish as the latest release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
