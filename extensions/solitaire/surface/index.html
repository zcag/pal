<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solitaire</title>
  <script src="/__pal/surface.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.ts"></script>
</head>
<body>
  <div id="felt"></div>
  <main id="table" aria-label="Klondike table"></main>
  <canvas id="cascade" aria-hidden="true"></canvas>
  <aside id="rail">
    <dl class="stats">
      <div><dt>Moves</dt><dd id="moves">0</dd></div>
      <div><dt>Time</dt><dd id="time">0:00</dd></div>
      <div><dt>Won</dt><dd id="record">none yet</dd></div>
      <div><dt>Home</dt><dd><span class="bar"><span id="home"></span></span></dd></div>
    </dl>
    <span class="badge" id="draw">Draw 1</span>
    <ul class="keys" id="keys"></ul>
  </aside>
  <div id="dialog" hidden>
    <div class="panel">
      <p class="big" id="dialog-title"></p>
      <p class="muted" id="dialog-text"></p>
      <div class="buttons">
        <button type="button" id="dialog-no"></button>
        <button type="button" id="dialog-yes" class="primary"></button>
      </div>
    </div>
  </div>
</body>
</html>
