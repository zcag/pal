<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackjack</title>
  <script src="/__pal/surface.js"></script>
  <link rel="stylesheet" href="./table.css">
  <script type="module" src="./main.ts"></script>
</head>
<body>
  <div id="felt">
    <svg id="print" aria-hidden="true"></svg>
    <div id="shoe"><div class="box"></div><div class="left"><i></i></div></div>
    <button id="new" class="btn corner" type="button" tabindex="-1" data-move="new">New game <span class="keys"><kbd>N</kbd></span></button>
    <div id="sprites"></div>
    <div id="confirm" role="dialog" aria-modal="true">
      <div class="box">
        <div>Start over with a fresh bankroll and stats?</div>
        <div class="row">
          <button class="btn" type="button" tabindex="-1" data-confirm="no">Keep playing <span class="keys"><kbd>←</kbd></span></button>
          <button class="btn primary" type="button" tabindex="-1" data-confirm="yes">Start over <span class="keys"><kbd>⏎</kbd></span></button>
        </div>
      </div>
    </div>
  </div>
  <div id="rail">
    <div id="bank"><div class="money">$0</div><div class="record"></div></div>
    <div id="moves"></div>
  </div>
</body>
</html>
